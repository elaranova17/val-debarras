<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 175" shape-rendering="geometricPrecision">
  <defs>
    <linearGradient id="lf" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0e8014"/>
      <stop offset="100%" stop-color="#18a01c"/>
    </linearGradient>
    <linearGradient id="rf" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1cb820"/>
      <stop offset="100%" stop-color="#28d02c"/>
    </linearGradient>
  </defs>
  <!-- Interior/top-right (darkest) -->
  <polygon points="100,5 192,52 100,52" fill="#0a5c0e"/>
  <!-- Top-left exterior (brightest) -->
  <polygon points="100,5 8,52 100,52" fill="#2dcc30"/>
  <!-- Left face -->
  <polygon points="8,52 100,52 100,168 8,152" fill="url(#lf)"/>
  <!-- Right face -->
  <polygon points="100,52 192,52 192,152 100,168" fill="url(#rf)"/>
</svg>
